<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#bgGrad)" stroke="#475569" stroke-width="2"/>

  <!-- PC Storage Vault Cylinder (Right) -->
  <g id="storageVault">
    <!-- Base Bottom Ellipse -->
    <ellipse cx="325" cy="340" rx="95" ry="35" fill="#1E3A5F" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Cylinder Body -->
    <rect x="230" y="255" width="190" height="85" fill="#1E3A5F"/>
    <line x1="230" y1="255" x2="230" y2="340" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="420" y1="255" x2="420" y2="340" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Middle Groove -->
    <path d="M 230 295 A 95 35 0 0 0 420 295" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.5"/>
    <!-- Top Platter Surface -->
    <ellipse cx="325" cy="255" rx="95" ry="35" fill="#294B70" stroke="#38BDF8" stroke-width="4"/>
    <!-- Center Spindle -->
    <ellipse cx="325" cy="255" rx="25" ry="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- LED Indicator -->
    <circle cx="395" cy="345" r="6" fill="#34D399" filter="url(#softGlow)"/>
  </g>

  <!-- iPhone Body (Left Overlapping) -->
  <g id="iPhone">
    <rect x="96" y="120" width="150" height="270" rx="24" ry="24" fill="url(#screenGrad)" stroke="#F1F5F9" stroke-width="5"/>
    <!-- Dynamic Island -->
    <rect x="149" y="134" width="44" height="10" rx="5" ry="5" fill="#F1F5F9" fill-opacity="0.85"/>
    <!-- Camera Roll / Media Flower Center -->
    <circle cx="171" cy="240" r="22" fill="#38BDF8" fill-opacity="0.75"/>
    <!-- Home Bar -->
    <rect x="144" y="372" width="54" height="4" rx="2" ry="2" fill="#F1F5F9" fill-opacity="0.9"/>
  </g>

  <!-- Wireless / Sync Pulsing Transfer Arcs -->
  <g id="syncArcs" stroke-linecap="round">
    <path d="M 225 180 A 150 130 0 0 1 350 240" fill="none" stroke="#38BDF8" stroke-width="6" filter="url(#softGlow)"/>
    <path d="M 235 195 A 125 105 0 0 1 340 248" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-opacity="0.85"/>
    <!-- Minimalist Arrowhead pointing to vault -->
    <polygon points="340,242 358,256 340,270" fill="#38BDF8"/>
  </g>
</svg>

